syntax = "proto3";

option csharp_namespace = "Stonks.Shared.Grpc";

package stonks;

// ── Existing service (unchanged) ────────────────────────────────────────────

service StocksAnalysis {
  rpc AnalyzeStock (AnalyzeStockRequest) returns (stream AnalyzeStockResponse);
  rpc AskFollowUp  (AskFollowUpRequest)  returns (stream AskFollowUpResponse);
}

message AnalyzeStockRequest {
  string ticker     = 1;
  string start_date = 2;  // YYYY-MM-DD
  string end_date   = 3;  // YYYY-MM-DD
}

message AnalyzeStockResponse {
  oneof payload {
    OhlcvData   ohlcv_data     = 1;
    string      analysis_chunk = 2;
    string      error_message  = 3;
  }
}

message OhlcvBar {
  string date   = 1;
  double open   = 2;
  double high   = 3;
  double low    = 4;
  double close  = 5;
  int64  volume = 6;
}

message OhlcvData {
  string            ticker = 1;
  repeated OhlcvBar bars   = 2;
}

message QaTurn {
  string question = 1;
  string answer   = 2;
}

message AskFollowUpRequest {
  string            ticker        = 1;
  string            analysis_text = 2;
  repeated QaTurn   prior_turns   = 3;  // all previous Q&A pairs from this session (not persisted)
  string            question      = 4;
  bool              include_bars  = 5;  // mirrors the client-side setting
  repeated OhlcvBar bars          = 6;  // only populated by the client when include_bars is true
}

message AskFollowUpResponse {
  oneof payload {
    string answer_chunk  = 1;
    string error_message = 2;
  }
}

// ── History service (new) ────────────────────────────────────────────────────

service StocksHistory {
  rpc GetAnalysisHistory (GetAnalysisHistoryRequest) returns (GetAnalysisHistoryResponse);
  rpc ReanalyzeStock     (ReanalyzeStockRequest)     returns (ReanalyzeStockResponse);
  rpc ReanalyzeAll       (ReanalyzeAllRequest)        returns (ReanalyzeAllResponse);
}

message AnalysisHistoryItem {
  string          ticker         = 1;
  string          analyzed_at    = 2;  // ISO 8601 UTC
  string          start_date     = 3;
  string          end_date       = 4;
  string          ai_result_text = 5;
  repeated string badges         = 6;
  double          price_at_close = 7;
}

message GetAnalysisHistoryRequest  {}
message GetAnalysisHistoryResponse { repeated AnalysisHistoryItem items = 1; }

message ReanalyzeStockRequest  { string ticker = 1; }
message ReanalyzeStockResponse { bool   queued  = 1; }

message ReanalyzeAllRequest  {}
message ReanalyzeAllResponse { int32 queued_count = 1; }

// ── Options market data (new) ────────────────────────────────────────────────

service OptionsMarketData {
  rpc GetOptionExpirations (GetOptionExpirationsRequest) returns (GetOptionExpirationsResponse);
  rpc GetOptionsChain      (GetOptionsChainRequest)      returns (GetOptionsChainResponse);
}

message GetOptionExpirationsRequest  { string ticker = 1; }
message GetOptionExpirationsResponse { repeated string expiration_dates = 1; }  // YYYY-MM-DD, ascending

message GetOptionsChainRequest {
  string ticker          = 1;
  string expiration_date = 2;  // YYYY-MM-DD
}

message OptionStrike {
  double strike       = 1;
  double call_premium = 2;
  double put_premium  = 3;
}

message GetOptionsChainResponse {
  double                underlying_price = 1;
  repeated OptionStrike strikes          = 2;
}

// ── Options evaluations persistence (new) ────────────────────────────────────

service OptionsEvaluations {
  rpc SaveOptionsEvaluation   (SaveOptionsEvaluationRequest)   returns (SaveOptionsEvaluationResponse);
  rpc GetOptionsEvaluations   (GetOptionsEvaluationsRequest)   returns (GetOptionsEvaluationsResponse);
  rpc DeleteOptionsEvaluation (DeleteOptionsEvaluationRequest) returns (DeleteOptionsEvaluationResponse);
}

message OptionEvaluationStrikeRow {
  double strike       = 1;
  double call_premium = 2;
  double put_premium  = 3;
}

message SaveOptionsEvaluationRequest {
  string                             ticker          = 1;
  string                             expiration_date  = 2;  // YYYY-MM-DD
  double                             current_price   = 3;
  double                             commission      = 4;
  repeated OptionEvaluationStrikeRow strikes         = 5;
}

message SaveOptionsEvaluationResponse { int64 id = 1; }

message GetOptionsEvaluationsRequest {}

message OptionsEvaluationItem {
  int64                              id              = 1;
  string                             ticker          = 2;
  string                             expiration_date = 3;
  double                             current_price   = 4;
  double                             commission      = 5;
  string                             saved_at        = 6;  // ISO 8601 UTC
  repeated OptionEvaluationStrikeRow strikes         = 7;
}

message GetOptionsEvaluationsResponse { repeated OptionsEvaluationItem items = 1; }

message DeleteOptionsEvaluationRequest  { int64 id      = 1; }
message DeleteOptionsEvaluationResponse { bool  deleted = 1; }
